services:
  db:
    image: postgres:17-alpine3.21
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres && psql -U postgres -c 'SELECT 1' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    command: [ "redis-server", "--appendonly", "yes" ]
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  backend:
    image: ghcr.io/techxtrmst/hrms-pbs:latest
    env_file:
      - .env
    environment:
      - DJANGO_SETTINGS_MODULE=hrms_core.settings
      - PYTHONUNBUFFERED=1
      - PYTHONDONTWRITEBYTECODE=1
      - DATABASE_HOST=db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - SERVICE_ROLE=web
    depends_on:
      db:
        condition: service_healthy
        restart: true
      redis:
        condition: service_healthy
        restart: true
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
      - logs_volume:/app/_logs
      # Shared volume for triggering backups
      - backup_triggers:/var/run/backup-triggers
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/api/health/" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8421}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_volume:/app/staticfiles:ro
      - media_volume:/app/media:ro
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.25"

  # =============================================================================
  # Backup Service
  # =============================================================================
  # Automated backups to Google Drive using restic + rclone
  # Schedule: DB every 3 hours, Media daily, Restore test monthly
  # =============================================================================
  backup:
    build:
      context: .
      dockerfile: scripts/Dockerfile.backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      # Database connection
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=postgres
      - PGPASSWORD=postgres
      - PGDATABASE=postgres
      # Google Drive credentials (from .env)
      - GDRIVE_TOKEN=${GDRIVE_TOKEN:-}
      - GDRIVE_ROOT_FOLDER_ID=${GDRIVE_ROOT_FOLDER_ID:-}
      # Optional encryption (leave empty for unencrypted backups)
      - RESTIC_PASSWORD=${RESTIC_PASSWORD:-}
      # Notifications
      - STAGING_TEAMS_WEBHOOK_URL=${STAGING_TEAMS_WEBHOOK_URL:-}
      # Timezone
      - TZ=${TIME_ZONE:-UTC}
      # Media path
      - MEDIA_PATH=/app/media
    volumes:
      # Media volume for backup (read-only)
      - media_volume:/app/media:ro
      # Restic cache for deduplication
      - backup_cache:/root/.cache/restic
      # Backup logs
      - backup_logs:/var/log/backup
      # Shared volume for trigger files
      - backup_triggers:/var/run/backup-triggers
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

volumes:
  postgres_data:
  redis_data:
  static_volume:
  media_volume:
  logs_volume:
  backup_cache:
  backup_logs:
  backup_triggers:
